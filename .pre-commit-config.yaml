# Install once after cloning:
#   uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# All hooks are local (no downloads): they use the tools already in the uv env.
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: unsupported
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: unsupported
        types: [python]
      - id: commit-msg-format
        name: commit message follows COMMITS.md
        entry: uv run --no-sync python scripts/check_commit_msg.py
        language: unsupported
        stages: [commit-msg]
