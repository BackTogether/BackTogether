<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helper robot</title>
<style>
  :root {
    --ink: #14232e; --muted: #5b6b76; --page: #f3f6f8; --card: #ffffff; --line: #d5dde3;
    --ok: #1f8a4c; --no: #c62f2f; --calm: #2a6f97; --found-bg: #e8f3ec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 22px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
    padding: 18px 32px; background: var(--card); border-bottom: 2px solid var(--line);
  }
  header h1 { margin: 0; font-size: 34px; }
  header .side { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  body.call header { background: var(--found-bg); border-color: var(--ok); }
  main { flex: 1; padding: 24px 32px; display: none; min-height: 0; }
  body.idle #idle, body.asking #asking { display: flex; }
  body.call #call { display: grid; }

  #idle, #asking { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #idle .clock { font-size: 120px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #asking h2 { font-size: 72px; margin: 0 0 12px; text-wrap: balance; }
  #asking p { color: var(--muted); font-size: 28px; margin: 0 0 40px; min-height: 1.4em; }
  #buttons { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  #buttons button {
    font: inherit; font-size: 48px; font-weight: 700; color: #fff; border: 0; border-radius: 28px;
    min-width: 380px; padding: 56px 40px; cursor: pointer;
  }
  #buttons button.positive { background: var(--ok); }
  #buttons button.negative { background: var(--no); }
  #buttons button:active { transform: scale(0.97); }

  #call { grid-template-columns: 1.45fr 1fr; gap: 24px; align-items: stretch; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 22px; }
  .card h3 { margin: 0 0 8px; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .video { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
  .video .icon { font-size: 120px; line-height: 1; }
  #call-title { font-size: 40px; font-weight: 700; text-wrap: balance; }
  #call-hint { color: var(--muted); font-size: 24px; }
  .stack { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  #parent-status { font-size: 30px; font-weight: 700; text-wrap: balance; }
  #countdown { font-size: 64px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--calm); }
  #breathing { display: none; align-items: center; gap: 28px; padding: 14px 0 4px; }
  #breathing.on { display: flex; }
  #circle {
    width: 70px; height: 70px; border-radius: 50%; background: var(--calm); opacity: .85; flex: none;
    transition: transform 6s ease-in-out;
  }
  #circle.in { transform: scale(1.6); transition-duration: 4s; }
  #breath-word { font-size: 30px; font-weight: 600; color: var(--calm); }
  .bystander { border-color: var(--ok); }
  .bystander p { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .bystander .number { color: var(--no); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 20px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  @media (max-width: 900px) { #call { grid-template-columns: 1fr; } #asking h2 { font-size: 44px; } }
  @media (prefers-reduced-motion: reduce) { #circle { transition: none; } }
</style>
</head>
<body class="idle">
<header>
  <h1 id="title">Helper robot</h1>
  <div class="side"><span id="found-time"></span> <span id="clock"></span></div>
</header>

<main id="idle">
  <div class="clock" id="big-clock"></div>
  <p id="idle-note">I help lost children find their family.</p>
</main>

<main id="asking">
  <h2 id="question"></h2>
  <p id="hint"></p>
  <div id="buttons"></div>
</main>

<main id="call">
  <div class="card video">
    <div class="icon" aria-hidden="true">📹</div>
    <div id="call-title"></div>
    <div id="call-hint">The video call opens on top of this page.</div>
  </div>
  <div class="stack">
    <div class="card">
      <div id="parent-status"></div>
      <div id="countdown"></div>
      <div id="breathing"><div id="circle"></div><div id="breath-word"></div></div>
    </div>
    <div class="card bystander">
      <h3>If you are nearby</h3>
      <p id="bystander-found"></p>
      <p>Their family knows and is coming. Please stay with them here.</p>
      <p>Emergency: call <span class="number" id="emergency-number"></span></p>
    </div>
    <div class="card"><h3>About this child</h3><dl id="child"></dl></div>
  </div>
</main>

<script>
const POLL_MS = 1000;
const BUTTONS = {
  ok: ["I'm okay", "positive"], help: ["I'm not okay", "negative"],
  yes: ["Yes", "negative"], no: ["No", "positive"],  // the only yes/no question is "did you get hurt?"
};
const ANSWERS = {
  how_are_you: { ok: "Says they are okay", help: "Says they are NOT okay" },
  hurt: { yes: "Says they got hurt", no: "Not hurt" },
};
const $ = (id) => document.getElementById(id);
let shownOptions = "";

const clock = (epochS) => new Date(epochS * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const minSec = (seconds) => {
  const s = Math.max(0, Math.round(seconds));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};

function fillList(dl, pairs) {
  dl.replaceChildren();
  for (const [term, value] of pairs) {
    const dt = document.createElement("dt"); dt.textContent = term;
    const dd = document.createElement("dd"); dd.textContent = value;
    dl.append(dt, dd);
  }
}

function showButtons(options) {
  const key = options.join(",");
  if (key === shownOptions) return;  // do not rebuild under the child's finger
  shownOptions = key;
  $("buttons").replaceChildren(...options.map((option) => {
    const [label, kind] = BUTTONS[option];
    const button = document.createElement("button");
    button.textContent = label; button.className = kind;
    button.onclick = () => fetch("/ui/answer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: option }),
    });
    return button;
  }));
}

function render(status) {
  const care = status.care;
  const now = Date.now() / 1000;
  const nowText = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("clock").textContent = nowText;
  $("big-clock").textContent = nowText;

  const inCall = care && status.state === "video_call";
  const asking = care && !inCall && ["talking", "waiting_answer"].includes(status.state);
  document.body.className = inCall ? "call" : asking ? "asking" : "idle";
  $("found-time").textContent = care && (inCall || asking) ? "Found at " + clock(care.found_time) + " ·" : "";
  if (!care || (!inCall && !asking)) {
    $("title").textContent = "Helper robot";
    $("idle-note").textContent = "I help lost children find their family.";
    shownOptions = ""; $("buttons").replaceChildren();
    return;
  }
  const child = care.child;
  const first = child.name.split(" ")[0];
  const parent = child.parents[0].called;
  if (asking) {
    $("title").textContent = "Hi " + first + "! I am here with you";
    $("question").textContent = care.question || "Are you okay?";
    $("hint").textContent = !care.options.length ? "Listen to the robot…"
      : care.listening ? "You can also say it out loud." : "";
    showButtons(care.options);
    return;
  }
  $("title").textContent = first + ", your family is coming";
  $("call-title").textContent = care.parent_coming ? "Video call with your family" : "Calling your " + parent + "…";
  const eta = care.eta_at ? care.eta_at - now : null;
  $("parent-status").textContent = care.parent_coming
    ? care.parent_coming + (eta === null ? " is coming" : " arrives in")
    : "Telling your family where you are";
  $("countdown").textContent = eta === null ? "" : (eta > 0 ? minSec(eta) : "any moment");
  $("breathing").className = care.breath ? "on" : "";
  $("circle").className = care.breath === "in" ? "in" : "";
  $("breath-word").textContent = care.breath === "in" ? "Fill the balloon" : care.breath === "out" ? "Blow it out" : "";
  $("bystander-found").textContent = child.name + " was lost and found here at " + clock(care.found_time) + ".";
  $("emergency-number").textContent = child.emergency_number;
  fillList($("child"), [
    ["Name", child.name + ", " + child.age],
    ["Wearing", child.description],
    ["How", [ANSWERS.how_are_you[care.how_are_you] || "Did not answer", ANSWERS.hurt[care.hurt] || "Hurt: no answer"].join(" · ")],
    ["Notes", child.notes.join(" · ")],
    ...child.parents.map((p) => [p.relation, p.name + " · " + p.phone]),
  ]);
}

async function poll() {
  try {
    render(await (await fetch("/status", { cache: "no-store" })).json());
  } catch (error) {
    document.body.className = "idle";
    $("title").textContent = "Helper robot";
    $("idle-note").textContent = "No connection to the robot.";
  }
  setTimeout(poll, POLL_MS);
}
poll();
</script>
</body>
</html>
