<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care robot</title>
<style>
  :root {
    --ink: #14232e; --muted: #5b6b76; --page: #f3f6f8; --card: #ffffff; --line: #d5dde3;
    --ok: #1f8a4c; --help: #c62f2f; --calm: #2a6f97; --alert-bg: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink);
    font: 22px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
    padding: 18px 32px; background: var(--card); border-bottom: 2px solid var(--line);
  }
  header h1 { margin: 0; font-size: 34px; }
  header .side { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  body.escalated header { background: var(--alert-bg); border-color: var(--help); }
  main { flex: 1; padding: 28px 32px; display: none; min-height: 0; }
  body.idle #idle, body.asking #asking { display: flex; }
  body.escalated #helping { display: grid; }

  #idle, #asking { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #idle .clock { font-size: 120px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #asking h2 { font-size: 72px; margin: 0 0 12px; text-wrap: balance; }
  #asking p { color: var(--muted); font-size: 28px; margin: 0 0 40px; min-height: 1.4em; }
  #buttons { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
  #buttons button {
    font: inherit; font-size: 48px; font-weight: 700; color: #fff; border: 0; border-radius: 28px;
    min-width: 380px; padding: 56px 40px; cursor: pointer;
  }
  #buttons button.positive { background: var(--ok); }
  #buttons button.negative { background: var(--help); }
  #buttons button:active { transform: scale(0.97); }

  #helping { grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: start; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 22px 26px; }
  .card h3 { margin: 0 0 10px; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #help-status { font-size: 44px; font-weight: 700; text-wrap: balance; }
  #countdown { font-size: 84px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--calm); }
  #breathing { display: none; flex-direction: column; align-items: center; padding: 56px 0 6px; }
  #breathing.on { display: flex; }
  #circle {
    width: 120px; height: 120px; border-radius: 50%; background: var(--calm); opacity: .85;
    transition: transform 6s ease-in-out;
  }
  #circle.in { transform: scale(1.6); transition-duration: 4s; }
  #breath-word { margin-top: 48px; font-size: 40px; font-weight: 600; color: var(--calm); }
  .bystander { border-color: var(--help); }
  .bystander p { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
  .bystander .number { color: var(--help); }
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .stack { display: grid; gap: 20px; }
  @media (max-width: 900px) { #helping { grid-template-columns: 1fr; } #asking h2 { font-size: 44px; } }
  @media (prefers-reduced-motion: reduce) { #circle { transition: none; } }
</style>
</head>
<body class="idle">
<header>
  <h1 id="title">Care robot</h1>
  <div class="side"><span id="floor-time"></span> <span id="clock"></span></div>
</header>

<main id="idle">
  <div class="clock" id="big-clock"></div>
  <p id="idle-note">Everything is fine.</p>
</main>

<main id="asking">
  <h2 id="question"></h2>
  <p id="hint"></p>
  <div id="buttons"></div>
</main>

<main id="helping">
  <div class="stack">
    <div class="card">
      <div id="help-status"></div>
      <div id="countdown"></div>
      <div id="breathing"><div id="circle"></div><div id="breath-word"></div></div>
    </div>
    <div class="card" id="triage-card"><h3>What they told the robot</h3><dl id="triage"></dl></div>
  </div>
  <div class="stack">
    <div class="card bystander">
      <h3>If you are nearby</h3>
      <p id="bystander-fall"></p>
      <p>Do not lift them. Keep them warm and talk to them.</p>
      <p>Emergency: call <span class="number" id="emergency-number"></span></p>
    </div>
    <div class="card"><h3>Emergency card</h3><dl id="profile"></dl></div>
  </div>
</main>

<script>
const POLL_MS = 1000;
const BUTTONS = {
  ok: ["I'm fine", "positive"], help: ["I need help", "negative"],
  yes: ["Yes", "positive"], no: ["No", "negative"],
};
const TRIAGE_LABELS = { hit_head: "Hit their head", in_pain: "In pain", can_move_legs: "Can move legs" };
const $ = (id) => document.getElementById(id);
let shownOptions = "";

const clock = (epochS) => new Date(epochS * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const minSec = (seconds) => {
  const s = Math.max(0, Math.round(seconds));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};

function fillList(dl, pairs) {
  dl.replaceChildren();
  for (const [term, value] of pairs) {
    const dt = document.createElement("dt"); dt.textContent = term;
    const dd = document.createElement("dd"); dd.textContent = value;
    dl.append(dt, dd);
  }
}

function showButtons(options) {
  const key = options.join(",");
  if (key === shownOptions) return;  // do not rebuild under the user's finger
  shownOptions = key;
  $("buttons").replaceChildren(...options.map((option) => {
    const [label, kind] = BUTTONS[option];
    const button = document.createElement("button");
    button.textContent = label; button.className = kind;
    button.onclick = () => fetch("/ui/answer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: option }),
    });
    return button;
  }));
}

function render(status) {
  const care = status.care;
  const now = Date.now() / 1000;
  const nowText = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("clock").textContent = nowText;
  $("big-clock").textContent = nowText;

  const escalated = status.state === "escalated" && care;
  const asking = !escalated && care && ["talking", "waiting_answer"].includes(status.state);
  document.body.className = escalated ? "escalated" : asking ? "asking" : "idle";
  $("floor-time").textContent = care && (escalated || asking)
    ? "Since the fall: " + minSec(now - care.fall_time) + " ·" : "";

  if (asking || (escalated && care.question)) {
    document.body.className = "asking";
    $("title").textContent = care.profile.name.split(" ")[0] + ", I am here with you";
    $("question").textContent = care.question || "Are you okay?";
    $("hint").textContent = !care.options.length ? "Listen to the robot…"
      : care.listening ? "You can also answer out loud." : "";
    showButtons(care.options);
  } else if (escalated) {
    $("title").textContent = "Help is coming";
    const eta = care.eta_at ? care.eta_at - now : null;
    $("help-status").textContent = care.caregiver
      ? (eta === null ? care.caregiver + " is getting help" : care.caregiver + " arrives in")
      : (care.alerts_sent ? "Calling your family…" : "Staying with you");
    $("countdown").textContent = eta === null ? "" : (eta > 0 ? minSec(eta) : "any moment");
    $("breathing").className = care.breath ? "on" : "";
    $("circle").className = care.breath === "in" ? "in" : "";
    $("breath-word").textContent = care.breath === "in" ? "Breathe in" : care.breath === "out" ? "Breathe out" : "";
    const answers = Object.entries(care.triage);
    $("triage-card").style.display = answers.length ? "" : "none";
    fillList($("triage"), answers.map(([key, value]) => [TRIAGE_LABELS[key] || key, value]));
    const p = care.profile;
    $("bystander-fall").textContent = p.name + " fell at " + clock(care.fall_time) + ".";
    $("emergency-number").textContent = p.emergency_number;
    fillList($("profile"), [
      ["Name", p.name + ", " + p.age], ["Conditions", p.conditions.join(", ")],
      ["Medication", p.medication.join(", ")], ["Allergies", p.allergies.join(", ")],
      ...p.contacts.map((c) => [c.relation, c.name + " · " + c.phone]),
    ]);
  } else {
    $("title").textContent = "Care robot";
    $("idle-note").textContent = "Everything is fine.";
    shownOptions = ""; $("buttons").replaceChildren();
  }
}

async function poll() {
  try {
    render(await (await fetch("/status", { cache: "no-store" })).json());
  } catch (error) {
    document.body.className = "idle";
    $("title").textContent = "Care robot";
    $("idle-note").textContent = "No connection to the robot.";
  }
  setTimeout(poll, POLL_MS);
}
poll();
</script>
</body>
</html>
