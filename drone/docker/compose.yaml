# Drone web app, lost-child tools and patrols. Run from drone/docker/ (details in README.md here):
#   docker compose --profile sim up --build      simulator + bounce patrol, http://localhost:8077
#   docker compose --profile mission up --build  simulator + lost-child mission + landing on the robot
#   docker compose --profile drone up --build    real drone, Linux host only (Bluetooth + Wi-Fi)
#   docker compose --profile patrol up --build   patrol against an SDK running elsewhere (SDK_URL)
#   docker compose run --rm tools drone/find leo --url http://host.docker.internal:8077
#                                                 any launcher against an SDK running elsewhere
name: drone

x-app: &app
  image: leukerbad/drone-app
  build: {context: .., dockerfile: docker/Dockerfile, target: app}

x-patrol: &patrol
  image: leukerbad/drone-patrol
  build: {context: .., dockerfile: docker/Dockerfile, target: patrol}

# Not in the images (personal data, local weights): the people database, the identify models
# (OpenCV Zoo ones are downloaded there on first use, the pad/robot/body ones are trained) and
# the recordings.
x-data: &data
  volumes:
    - ../identify/people:/app/drone/identify/people
    - ../identify/models:/app/drone/identify/models
    - ../../recordings:/app/recordings

services:
  sim:
    <<: *app
    profiles: [sim, mission]
    command: [python, -m, drone.sdk, sim, --bind, 0.0.0.0, --http-port, "8077", --no-browser, --room, "4"]
    ports: ["8077:8077"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/api/state')"]
      interval: 2s
      retries: 15

  # Bounce against the simulator: enters MANUAL, presses the sim takeoff button, then patrols
  # with the simulator's true wall distance (--fake-depth), so no camera is needed.
  patrol-sim:
    <<: *patrol
    profiles: [sim]
    depends_on: {sim: {condition: service_healthy}}
    command:
      - sh
      - -c
      - >-
        python -c "import urllib.request as u;
        [u.urlopen(u.Request('http://sim:8077' + p, data=b'{}')) for p in ('/api/drone/manual', '/sim/button')]"
        && python -m drone.patrol.bounce --sdk http://sim:8077 --fake-depth

  # The lost-child mission against the simulator, which has a fake child (3.5 m ahead, 1.5 m
  # left) and a fake detector: MANUAL, the test mission (drone/patrol/live mission), the takeoff
  # button, wait for the takeoff; then drone/dock waits for the mission to fly home and lands the drone on the pad of
  # a simulated robot instead. It shares the simulator's network, so the launchers' default
  # http://127.0.0.1:8077 is the simulator.
  mission-sim:
    <<: *app
    profiles: [mission]
    depends_on: {sim: {condition: service_healthy}}
    network_mode: service:sim
    environment:
      SIM_ROBOT: ${SIM_ROBOT:-3 1}
    command:
      - sh
      - -c
      - >-
        curl -sf -X POST localhost:8077/manual && echo
        && drone/patrol/live mission
        && curl -sf -X POST localhost:8077/sim/button && echo
        && python -c "import time; from drone.sdk.client import DroneClient as C; c = C('http://127.0.0.1:8077');
        [time.sleep(0.5) for _ in iter(lambda: c.status()['telemetry']['in_flight'], True)]"
        && drone/dock --sim --sim-robot $$SIM_ROBOT

  # Real drone. Only on a Linux host: Bluetooth goes through the host's BlueZ (D-Bus) and the
  # drone's Wi-Fi, UDP video (7078) and sticks (19091) need the host network. On macOS and
  # Windows, Docker runs in a VM without Bluetooth: run `drone/fly` natively there instead.
  drone:
    <<: *app
    profiles: [drone]
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
      - ../../recordings:/app/recordings
    command: [python, -m, drone.sdk, serve, --http-port, "8077", --no-browser, --max, "60"]

  # The launchers (drone/find, drone/land, drone/dock, drone/patrol/live, python -m
  # drone.identify...) against an SDK that runs elsewhere, by default natively on the Mac/Windows
  # host. find, land and dock take --url; drone/patrol/live reads SDK.
  tools:
    <<: [*patrol, *data]
    profiles: [tools]
    environment:
      SDK: ${SDK_URL:-http://host.docker.internal:8077}

  # Bounce with the camera's depth model against an SDK that runs natively on the Mac/Windows
  # host (`drone/fly`, `drone/patrol/winfly web`), which Docker Desktop names host.docker.internal.
  # PATROL_ARGS defaults to --dry-run (decide and print, send no sticks).
  # On a Linux host with the `drone` service: `docker compose run --rm --network host patrol
  # python -m drone.patrol.bounce --sdk http://127.0.0.1:8077 --dry-run`.
  patrol:
    <<: *patrol
    profiles: [patrol]
    environment:
      SDK_URL: ${SDK_URL:-http://host.docker.internal:8077}
      PATROL_ARGS: ${PATROL_ARGS:---dry-run}
    command: [sh, -c, 'python -m drone.patrol.bounce --sdk "$$SDK_URL" $$PATROL_ARGS']
