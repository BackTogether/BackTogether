<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>hoverctl</title>
<!-- Loaded without blocking: offline on the drone's Wi-Fi it fails and the system fonts stay. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #07080b; --panel: #0c0e13; --ink: #e9ecf1; --muted: #9199a6; --faint: #5a616d;
    --line: #e9ecf1; --rule: #252932; --red: #b4443e;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --gap: 16px; --side: 380px; --pip-w: 320px; --pip-clear: calc(var(--pip-w) * 9 / 16 + var(--gap));
    --controls-h: clamp(270px, 36vh, 360px); --legend-h: 126px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding: var(--gap);
    height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  button { all: unset; cursor: pointer; }

  .frame { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr);
    border: 1px solid var(--line); background: var(--panel); }
  .top { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 12px; padding: 13px 18px; }
  .brand b { font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  .brand span { color: var(--muted); }
  .status { display: flex; }
  .cell { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid var(--line);
    color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cell b { color: var(--ink); font-weight: 500; }
  .cell.tag { background: var(--ink); color: var(--bg); }
  .cell.warn, .cell.warn b { color: var(--red); }
  .cell.tag b { color: var(--bg); }
  .cell.stale, .cell.stale b { color: var(--faint); }
  button.cell:hover { color: var(--ink); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) var(--side); min-height: 0; }
  .stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) var(--controls-h);
    min-height: 0; }
  body.mini .stage { grid-template-rows: minmax(0, 1fr); }

  .video { position: relative; min-height: 0; background: var(--bg); overflow: hidden; }
  .video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  body.mini .video { position: absolute; z-index: 2; top: var(--gap); left: var(--gap);
    width: var(--pip-w); height: auto; aspect-ratio: 16 / 9; border: 1px solid var(--line); cursor: pointer; }
  .corner { position: absolute; padding: 2px 6px; background: var(--panel); color: var(--faint);
    pointer-events: none; z-index: 1; }
  .tl { left: 8px; top: 8px; } .tr { right: 8px; top: 8px; }
  .no-video { position: absolute; inset: 0; display: grid; place-content: center; gap: 8px;
    text-align: center; padding: 24px; background: var(--panel); }
  .no-video .big { font-size: 30px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
  .no-video .mono { color: var(--muted); }
  body.mini .no-video .big { font-size: 15px; }
  body.mini .no-video .mono, body.mini .video .tr { display: none; }
  .stall { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); padding: 4px 10px;
    border: 1px solid var(--red); background: var(--panel); color: var(--red); }
  .takeoff { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 1;
    display: grid; gap: 4px; padding: 10px 18px; text-align: center; background: var(--ink); color: var(--bg); }
  .takeoff b { font: 600 22px var(--mono); letter-spacing: .16em; }
  body.mini .takeoff { bottom: 8px; padding: 4px 8px; }
  body.mini .takeoff b { font-size: 13px; }
  body.mini .takeoff span { display: none; }
  [hidden] { display: none !important; }

  .controls { container-type: size; display: grid; grid-template-columns: 1fr minmax(200px, 260px) 1fr;
    align-items: center; justify-items: center; gap: var(--gap); padding: 14px 24px;
    border-top: 1px solid var(--line); min-height: 0; }
  body.mini .controls { border-top: 0; padding-top: var(--pip-clear); }
  .stick { --pad: min(26cqw, calc(100cqh - var(--legend-h)));
    display: grid; gap: 10px; justify-items: center; }
  body.mini .stick { --pad: min(34cqw, calc(100cqh - var(--legend-h)), 460px); }
  .caption { width: var(--pad); display: flex; justify-content: space-between; color: var(--faint);
    font-variant-numeric: tabular-nums; }
  .caption b { font-weight: 500; color: var(--muted); }
  .stick.live .caption b { color: var(--ink); }
  .pad { position: relative; width: var(--pad); height: var(--pad); border: 1px solid var(--line);
    touch-action: none; cursor: crosshair; }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--rule); }
  .pad::before { left: 50%; top: 0; bottom: 0; width: 1px; }
  .pad::after { top: 50%; left: 0; right: 0; height: 1px; }
  .knob { position: absolute; left: 50%; top: 50%; width: 14%; aspect-ratio: 1; z-index: 1;
    transform: translate(-50%, -50%); border: 1px solid var(--line); background: var(--panel); }
  .stick.live .knob { background: var(--ink); }

  .keys { display: grid; grid-template-columns: repeat(3, 26px); grid-auto-rows: 24px; gap: 4px; }
  kbd { display: grid; place-items: center; min-width: 26px; padding: 0 6px; border: 1px solid var(--faint);
    color: var(--muted); font: 500 11px var(--mono); text-transform: uppercase; }
  kbd.held { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .keys .up { grid-column: 2; } .keys .left { grid-column: 1; grid-row: 2; }
  .keys .down { grid-column: 2; grid-row: 2; } .keys .right { grid-column: 3; grid-row: 2; }
  .hint { color: var(--faint); }

  .center { display: grid; gap: 14px; width: 100%; }
  #stop { display: grid; place-items: center; height: 76px; background: var(--red); border: 1px solid var(--red);
    color: #fff; font: 600 20px var(--mono); letter-spacing: .24em; touch-action: none; }
  #stop.flash { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
  .legend > span:first-of-type, .legend .caps { display: flex; gap: 4px; }

  .side { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; }
  .side section + section { border-top: 1px solid var(--line); }
  .side h2 { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--rule); color: var(--muted);
    font-weight: 500; display: flex; justify-content: space-between; }
  .meters { display: grid; grid-template-columns: max-content 1fr 72px; align-items: center; gap: 12px 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--rule); }
  .meters span { color: var(--muted); }
  .meters output { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .meter { position: relative; height: 10px; border: 1px solid var(--faint); }
  .meter::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px;
    background: var(--muted); }
  .meter i { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; background: var(--ink); }
  .meter .cap { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--faint); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; }
  .kv > div { padding: 9px 16px 10px; border-bottom: 1px solid var(--rule); min-width: 0; }
  .kv > div:nth-child(odd):not(.wide) { border-right: 1px solid var(--rule); }
  .kv > div:last-child:nth-child(odd) { border-right: 0; }
  .kv .wide { grid-column: 1 / -1; }
  .kv label { display: block; color: var(--faint); font-size: 10.5px; }
  .kv output { display: block; font: 13px/1.5 var(--mono); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kv output.warn { color: var(--red); }
  .kv output.wrap { white-space: normal; word-break: break-all; }
  .kv output.dim { color: var(--faint); }
  .kv .alt output { font: 500 28px/1.15 var(--sans); letter-spacing: -.02em; }
  #hex { margin: 4px 0 0; color: var(--muted); font: 10.5px/1.6 var(--mono); white-space: pre-wrap;
    word-break: break-all; }

  .dronemode { padding: 14px 16px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
  .dronemode .big { font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; }
  .dronemode .mono { color: var(--muted); }
  .side h3 { margin: 0; padding: 7px 16px; border-bottom: 1px solid var(--rule); color: var(--faint);
    font-weight: 500; display: flex; justify-content: space-between; background: var(--bg); }
  .group.stale output, .stale { color: var(--faint); }
  .bar { height: 4px; border: 1px solid var(--faint); margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink); }
  .group.stale .bar i { background: var(--faint); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0; }
  .actions.wifi { grid-template-columns: 1fr auto; padding-bottom: 0; }
  .btn { display: grid; place-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--line);
    font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .btn:hover { background: var(--rule); }
  .btn.armed { background: var(--red); border-color: var(--red); color: #fff; }
  .btn:disabled, .btn.off { opacity: .35; cursor: default; pointer-events: none; }
  .speed { display: grid; grid-template-columns: auto repeat(5, 1fr) auto; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--rule); }
  .speed label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding-right: 12px; }
  .speed .btn { height: 28px; padding: 0; margin-left: -1px; font: 12px var(--mono); }
  .speed .btn.on { background: var(--ink); color: var(--bg); }
  .speed #sport { margin-left: 10px; padding: 0 10px; letter-spacing: .1em; }
  .speed #sport.on, .cell.sport { background: var(--red); border-color: var(--red); color: #fff; }
  .cell.sport b { color: #fff; }
  .quality { display: grid; grid-template-columns: auto 1fr 1fr; align-items: center; gap: 0;
    padding: 10px 16px; border-bottom: 1px solid var(--rule); }
  .quality label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding-right: 12px; }
  .quality .btn { height: 28px; padding: 0; margin-left: -1px; }
  .quality .btn.on { background: var(--ink); color: var(--bg); }
  input[type=password], input[type=text] { all: unset; box-sizing: border-box; height: 34px; padding: 0 10px;
    border: 1px solid var(--faint); font: 13px var(--mono); user-select: text; -webkit-user-select: text; min-width: 0; }
  input:focus { border-color: var(--line); }
  #d-manual-steps { padding: 8px 16px 0; color: var(--muted); }
  #d-manual-steps.warn { color: var(--red); }
  #d-action-status { padding: 8px 16px 12px; min-height: 36px; color: var(--muted); }
  #d-action-status.warn { color: var(--red); }
  .lock { padding: 6px 10px; border: 1px solid var(--line); text-align: center; color: var(--ink); }
  .controls.locked .stick { opacity: .3; }
  .controls.locked .legend .gate { color: var(--ink); }

  /* camera tilt presets (drone.sdk server only) */
  .tilt { display: grid; grid-template-columns: auto repeat(5, 1fr); align-items: center;
    padding: 12px 16px 0; }
  .tilt label { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    padding-right: 12px; }
  .tilt .btn { height: 28px; padding: 0 2px; margin-left: -1px; font: 10.5px var(--mono); letter-spacing: 0;
    white-space: nowrap; }
  .tilt .btn.on { background: var(--ink); color: var(--bg); }
  .tilt form { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr auto; margin-top: 6px; }
  .tilt input { height: 28px; }
  .tilt form .btn { margin-left: -1px; padding: 0 14px; }

  /* photos and recording (drone.sdk server only) */
  .capture { position: absolute; left: 8px; bottom: 8px; z-index: 1; display: flex; align-items: center; }
  .capture .btn { height: 28px; padding: 0 10px; margin-right: -1px; gap: 6px; background: var(--panel);
    grid-auto-flow: column; }
  .capture .btn kbd { min-width: 0; height: 16px; padding: 0 4px; font-size: 10px; }
  .capture .btn.rec-on { border-color: var(--red); color: var(--red); }
  .capture .btn.rec-on kbd { border-color: var(--red); color: var(--red); }
  .rec-dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%;
    background: var(--red); vertical-align: middle; }
  .capture-status { margin-left: 10px; padding: 2px 6px; background: var(--panel); color: var(--muted);
    max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .capture-status.warn { color: var(--red); }
  body.mini .capture { display: none; }

  /* estimated pose: compass and path map */
  .dials { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--rule); }
  .dial { padding: 10px 12px 8px; display: grid; gap: 6px; min-width: 0; }
  .dial + .dial { border-left: 1px solid var(--rule); }
  .dial label { color: var(--faint); font-size: 10.5px; display: flex; justify-content: space-between; }
  .dial svg { width: 100%; aspect-ratio: 1; display: block; overflow: hidden; }
  .est-tag { padding: 0 6px; border: 1px solid var(--line); color: var(--ink); }
  .ln { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ln.faint { stroke: var(--faint); }
  .ln.rule { stroke: var(--rule); }
  .ln.dash { stroke-dasharray: 3 3; }
  .ink { fill: var(--ink); stroke: none; }
  .wedge { fill: var(--ink); fill-opacity: .14; stroke: var(--faint); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .svg-text { fill: var(--muted); font-family: var(--mono); }
  #needle { transition: transform 250ms linear; }
  .est-note { padding: 8px 16px 12px; color: var(--faint); }

  @media (max-width: 900px) {
    body { height: auto; overflow: auto; padding: 0; }
    .frame { height: auto; border: 0; }
    .main { grid-template-columns: 1fr; }
    .stage { height: 100svh; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .status .cell:not(.tag):not(#link):not(#drone-mode) { display: none; }
    .controls { grid-template-columns: 1fr 1fr; padding: 12px var(--gap); --controls-h: 360px; }
    .center { grid-column: 1 / -1; grid-row: 1; }
    .stick { --pad: min(40cqw, calc(100cqh - var(--legend-h) - 110px)); }
    .legend { display: none; }
  }
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="brand"><b>hoverctl</b><span>HoverAir X1</span></div>
    <div class="status">
      <span class="cell mono" id="drone-mode">mode <b>—</b></span>
      <span class="cell mono" id="flight-state">state <b>—</b></span>
      <span class="cell mono" id="sport-cell" title="is_sport_mode in the stick packets">sport <b>off</b></span>
      <span class="cell mono" id="battery">bat <b>—</b></span>
      <span class="cell mono" id="mode">—</span>
      <span class="cell mono" id="keys-held" title="lit while this page holds a flight key">keys <b>—</b></span>
      <span class="cell mono" id="link">link <b>—</b></span>
      <span class="cell mono" id="video-status">video <b>—</b></span>
      <button class="cell mono" id="toggle-video" type="button"><kbd>V</kbd><span id="toggle-label">minimize video</span></button>
    </div>
  </header>

  <main class="main">
    <section class="stage">
      <div class="video" id="video" title="">
        <img id="stream" alt="">
        <span class="corner tl mono" id="cam-port">cam</span>
        <span class="corner tr mono" id="cam-format"></span>
        <div class="no-video" id="no-video">
          <div class="big">No video</div>
          <div class="mono" id="no-video-detail">waiting for the server</div>
        </div>
        <span class="stall mono" id="stall" hidden></span>
        <div class="takeoff" id="takeoff" hidden><b id="takeoff-title"></b><span class="mono" id="takeoff-hint"></span></div>
        <div class="capture" id="capture" hidden>
          <button class="btn" id="c-photo" type="button" title="Save the current frame on the Mac (recordings/)"><kbd>P</kbd>photo</button>
          <button class="btn" id="c-record" type="button" title="Record the live stream to an MP4 on the Mac (recordings/), no re-encode"><kbd>R</kbd><span id="c-record-label">rec</span></button>
          <button class="btn" id="c-drone-photo" type="button" title="Full-quality photo on the drone's SD card (camera_take_photo_request)">photo on drone</button>
          <button class="btn" id="c-drone-record" type="button" title="Recording on the drone's SD card (camera_start_video_request)">rec on drone</button>
          <span class="capture-status mono" id="c-status" hidden></span>
        </div>
      </div>

      <div class="controls">
        <div class="stick">
          <div class="pad" id="pad-left" data-x="yaw" data-y="thrust"><div class="knob"></div></div>
          <div class="keys" id="keys-left"></div>
        </div>
        <div class="center">
          <div class="lock mono" id="lock" hidden></div>
          <button id="stop" type="button">STOP</button>
          <div class="legend mono" id="legend"></div>
        </div>
        <div class="stick">
          <div class="pad" id="pad-right" data-x="roll" data-y="pitch"><div class="knob"></div></div>
          <div class="keys" id="keys-right"></div>
        </div>
      </div>
    </section>

    <aside class="side">
      <section id="estimate" hidden>
        <h2 class="mono"><span>Position · estimated</span><span id="e-source"></span></h2>
        <div class="dials">
          <div class="dial">
            <label class="mono"><span>heading</span><span class="est-tag">estimated</span></label>
            <svg viewBox="-100 -100 200 200" aria-label="estimated heading">
              <circle class="ln" r="88"></circle>
              <g id="ticks"></g>
              <path class="wedge" id="wedge"></path>
              <g id="travel"><line class="ln dash" x1="0" y1="0" x2="0" y2="-60" id="travel-line"></line>
                <polygon class="ln" id="travel-head" points="0,-66 -5,-56 5,-56"></polygon></g>
              <g id="needle"><polygon class="ink" points="0,-80 4,0 -4,0"></polygon>
                <line class="ln faint" x1="0" y1="0" x2="0" y2="22"></line></g>
              <circle class="ink" r="3"></circle>
            </svg>
          </div>
          <div class="dial">
            <label class="mono"><span>path since takeoff</span><span id="e-scale"></span></label>
            <svg id="map" viewBox="-5 -5 10 10" aria-label="estimated path"></svg>
          </div>
        </div>
        <div class="kv">
          <div><label class="mono">heading · ± 1 sd</label><output id="e-heading">—</output></div>
          <div><label class="mono">travel · speed</label><output id="e-travel">—</output></div>
          <div><label class="mono">position x y · ± 1 sd</label><output id="e-position">—</output></div>
          <div><label class="mono">altitude</label><output id="e-alt">—</output></div>
          <div class="wide"><label class="mono">autopilot</label><output class="wrap" id="e-task">—</output></div>
        </div>
        <div class="mono est-note" id="e-note"></div>
      </section>
      <section id="drone">
        <h2 class="mono"><span>Drone · bluetooth</span><span id="d-link-age"></span></h2>
        <div class="dronemode"><div class="big" id="d-mode">—</div><div class="mono" id="d-note"></div><div class="mono" id="d-wifi-note"></div></div>
        <div id="d-groups"></div>
        <div class="actions">
          <button class="btn" id="d-manual" type="button" title="What the app does on Manual Control: Wi-Fi heartbeat, preview, manual flag, video">Manual control</button>
          <button class="btn" id="d-land" type="button">Land</button>
        </div>
        <div class="actions">
          <button class="btn" id="d-video" type="button">Video start</button>
          <button class="btn" id="d-video-stop" type="button">Video stop</button>
        </div>
        <div class="tilt" id="d-tilt" hidden title="Camera tilt, estimated and open loop (drone/sdk/tilt.py): anchors at the top stop first if unknown. STOP or any flight key cancels">
          <label class="mono">tilt</label>
          <button class="btn" type="button" data-tilt="15">+15 top</button>
          <button class="btn" type="button" data-tilt="0">0 level</button>
          <button class="btn" type="button" data-tilt="-30">−30</button>
          <button class="btn" type="button" data-tilt="-45">−45</button>
          <button class="btn" type="button" data-tilt="-90">−90 down</button>
          <form id="d-tilt-form" autocomplete="off">
            <input type="text" inputmode="decimal" id="d-tilt-deg" placeholder="any angle, +15 … −90">
            <button class="btn" type="submit">tilt</button>
          </form>
        </div>
        <div class="mono" id="d-manual-steps"></div>
        <form class="actions wifi" id="d-wifi" autocomplete="off">
          <input type="password" id="d-wifi-pw" placeholder="wi-fi password (8+)" autocomplete="off">
          <button class="btn" id="d-wifi-set" type="submit">Set</button>
        </form>
        <div class="mono" id="d-action-status"></div>
      </section>
      <section>
        <h2 class="mono"><span>Sticks · output</span><span id="max-label"></span></h2>
        <div class="speed" id="speed" title="Speed cap: how far the sticks go, in % of full stick. Keys - and =">
          <label class="mono">speed</label>
        </div>
        <div class="meters" id="meters"></div>
        <div class="kv">
          <div><label class="mono">max cap</label><output id="s-max">—</output></div>
          <div><label class="mono">packets sent</label><output id="s-sent">—</output></div>
          <div><label class="mono">non-neutral sent</label><output id="s-non-neutral">—</output></div>
          <div><label class="mono">gate</label><output id="s-gate">—</output></div>
          <div><label class="mono">errors</label><output id="s-errors">—</output></div>
          <div><label class="mono">target</label><output id="s-target">—</output></div>
          <div><label class="mono">control source</label><output id="s-source">—</output></div>
          <div><label class="mono">sport (is_sport_mode)</label><output id="s-sport">—</output></div>
          <div class="wide"><label class="mono">last packet sent · our signs</label><output id="s-last-axes">—</output></div>
          <div class="wide"><label class="mono">last packet · packet values</label><output class="wrap" id="s-last-packet">—</output></div>
          <div class="wide"><label class="mono">last packet · hex</label><output class="wrap" id="s-last-hex">—</output></div>
          <div class="wide"><label class="mono">last error</label><output class="wrap" id="s-last-error">—</output></div>
        </div>
      </section>
      <section>
        <h2 class="mono"><span>Video</span><span id="v-port"></span></h2>
        <div class="quality" id="quality" title="SD: what the app gets. HD: also asks the drone for its MEDIUM preview resolution (untested)">
          <label class="mono">preview</label>
          <button class="btn" type="button" data-quality="sd">SD</button>
          <button class="btn" type="button" data-quality="hd">HD (try)</button>
        </div>
        <div class="kv">
          <div><label class="mono">decoded size</label><output id="v-size">—</output></div>
          <div><label class="mono">decoded fps</label><output id="v-fps">—</output></div>
          <div class="wide"><label class="mono">quality · asked / drone</label><output class="wrap" id="v-quality">—</output></div>
          <div><label class="mono">packets</label><output id="v-packets">—</output></div>
          <div><label class="mono">pkt/s</label><output id="v-pps">—</output></div>
          <div><label class="mono">KB/s</label><output id="v-kbps">—</output></div>
          <div><label class="mono">frames</label><output id="v-frames">—</output></div>
          <div><label class="mono">kind</label><output id="v-kind">—</output></div>
          <div><label class="mono">codec</label><output id="v-codec">—</output></div>
          <div class="wide"><label class="mono">senders</label><output class="wrap" id="v-senders">—</output></div>
          <div class="wide"><label class="mono">dump</label><output class="wrap" id="v-dump">—</output></div>
          <div class="wide" id="hex-cell" hidden><label class="mono">first datagrams (hex)</label><pre id="hex"></pre></div>
        </div>
      </section>
    </aside>
  </main>
</div>

<script>
const BINDINGS = /*KEY_BINDINGS*/{};
const DIRECTIONS = /*AXIS_DIRECTIONS*/{};  // axis -> [name of +, name of -], e.g. pitch: fwd / back
const AXES = ["roll", "pitch", "thrust", "yaw", "gimbal"];
const AXIS_LIMIT = 100;       // wire range of every axis, -100..100
const SEND_MS = 50;           // the server turns sticks neutral 300 ms after the last post
const POLL_MS = 250;
const CLOCK_MS = 100;         // refresh of the freshness readouts
const STALE_MS = 1000;        // no state update for this long: link lost
const VIDEO_STALL_MS = 2000;  // decoded frames stopped for this long: video stalled
const FPS_WINDOW_MS = 2000;
const RETRY_VIDEO_MS = 2000;
const KNOB_TRAVEL = 0.42;     // knob reach from the pad centre, as a fraction of the pad width
const HEX_LINES = 6;
const FLASH_MS = 150;
const DATA_STALE_S = 5;       // drone data older than this is greyed out
const LAND_ARM_MS = 3000;     // LAND needs a second click within this time
const STATUS_MS = 6000;       // how long an action result stays on screen
const MIN_WIFI_PASSWORD = 8;
const MANUAL_STEPS = ["connect", "wifi", "preview", "manual", "video"];  // the order enter_manual() runs them
const CONTROL_SOURCE_NAMES = { 1: "app (1)", 6: "cross-key (6)" };  // packet control_source_type
const GATE_LIVE = "live";
const DRONE_NETWORK_PREFIX = "<DRONE_SUBNET>.";  // the laptop's address here means it is on the drone's Wi-Fi
const KIB_PER_GIB = 1024 ** 2;  // the drone's storage fields are named bytes but read as KiB (32 GB card = 33554432)
const STOP_KEY = " ";
const VIDEO_KEY = "v";
const PHOTO_KEY = "p";        // photo / recording on the Mac (drone.sdk server only)
const RECORD_KEY = "r";
const COMPASS_TICK_DEG = 30;
const TRAVEL_MIN_SPEED = 0.1; // m/s: below this no direction-of-travel arrow
const TRAVEL_MIN_LEN = 24, TRAVEL_MAX_LEN = 70, TRAVEL_LEN_PER_MPS = 40;  // compass units
const MAP_MIN_HALF_M = 3;     // the map shows at least ±3 m
const MAP_MARGIN_M = 1;
const SPORT_KEY_CODES = ["Backslash", "Tab"];  // toggle is_sport_mode; Tab would move the focus
// Takeoff states, shown large over the video: the drone flies these on its own.
const TAKEOFF_STATES = {
  pre_takeoff: ["PRE-TAKEOFF", "rotors starting · hands clear"],
  taking_off: ["TAKING OFF", "the drone's own climb (~2 s), it may move by itself · sticks after FLYING MANUAL"],
};

const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(-1, Math.min(1, v));
const signed = (v, digits) => (v < 0 ? "-" : "+") + Math.abs(v).toFixed(digits);
const keys = new Set();
// Readouts say "fwd 28" or "back 28", never a sign: the packet's signs differ from ours.
const axisLabel = (axis) => DIRECTIONS[axis].join("/");
const describe = (axis, value, digits) =>
  `${DIRECTIONS[axis][value > 0 ? 0 : 1]} ${Math.abs(value).toFixed(digits)}`;

// ---- input: pointer pads + keyboard, merged into one set of axes ----

function makePad(element) {
  const pad = { element, xAxis: element.dataset.x, yAxis: element.dataset.y, x: 0, y: 0, pointer: null };
  pad.knob = element.querySelector(".knob");
  element.insertAdjacentHTML("beforebegin",
    `<div class="caption mono"><span><b></b></span><span><b></b></span></div>`);
  [pad.yValue, pad.xValue] = element.previousElementSibling.querySelectorAll("b");
  const move = (event) => {
    const rect = element.getBoundingClientRect();
    const reach = rect.width * KNOB_TRAVEL;
    pad.x = clamp((event.clientX - rect.left - rect.width / 2) / reach);
    pad.y = clamp((rect.top + rect.height / 2 - event.clientY) / reach);
    drawInput();
  };
  pad.release = () => { pad.pointer = null; pad.x = 0; pad.y = 0; };
  element.addEventListener("pointerdown", (event) => {
    pad.pointer = event.pointerId;
    element.setPointerCapture(event.pointerId);
    move(event);
  });
  element.addEventListener("pointermove", (event) => { if (event.pointerId === pad.pointer) move(event); });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    element.addEventListener(type, (event) => {
      if (event.pointerId === pad.pointer) { pad.release(); drawInput(); }
    });
  }
  return pad;
}

const pads = [makePad($("pad-left")), makePad($("pad-right"))];

function inputAxes() {
  const axes = Object.fromEntries(AXES.map((axis) => [axis, 0]));
  for (const pad of pads) { axes[pad.xAxis] += pad.x; axes[pad.yAxis] += pad.y; }
  for (const key of keys) {
    const [axis, direction] = BINDINGS[key];
    axes[axis] += direction;
  }
  for (const axis of AXES) axes[axis] = clamp(axes[axis]);
  return axes;
}

// The knobs show the merged input, so held keys move them too.
function drawInput() {
  const axes = inputAxes();
  for (const pad of pads) {
    const x = axes[pad.xAxis], y = axes[pad.yAxis];
    pad.knob.style.left = `${50 + x * KNOB_TRAVEL * 100}%`;
    pad.knob.style.top = `${50 - y * KNOB_TRAVEL * 100}%`;
    pad.element.parentElement.classList.toggle("live", x !== 0 || y !== 0);
    pad.xValue.textContent = x ? describe(pad.xAxis, x, 2) : axisLabel(pad.xAxis);
    pad.yValue.textContent = y ? describe(pad.yAxis, y, 2) : axisLabel(pad.yAxis);
  }
  for (const cap of document.querySelectorAll("kbd[data-key]")) {
    cap.classList.toggle("held", keys.has(cap.dataset.key));
  }
  const held = [...keys].join(" ").toUpperCase();
  setCell("keys-held", "keys", held || "—", held ? "tag" : "");
}

// ---- key legend, built from the server's bindings ----

const keyFor = (axis, direction) =>
  Object.keys(BINDINGS).find((key) => BINDINGS[key][0] === axis && BINDINGS[key][1] === direction);
const keyCap = (key, extra = "") => `<kbd class="${extra}" data-key="${key}">${key}</kbd>`;

for (const [pad, id] of [[pads[0], "keys-left"], [pads[1], "keys-right"]]) {
  $(id).innerHTML = keyCap(keyFor(pad.yAxis, 1), "up") + keyCap(keyFor(pad.xAxis, -1), "left") +
    keyCap(keyFor(pad.yAxis, -1), "down") + keyCap(keyFor(pad.xAxis, 1), "right");
}
$("legend").innerHTML =
  `<span class="caps">${keyCap(keyFor("gimbal", 1))}${keyCap(keyFor("gimbal", -1))}</span>` +
  `<span class="hint">camera up / down</span>` +
  `<span class="caps"><kbd>space</kbd></span><span class="hint">stop, all neutral</span>` +
  `<span class="caps gate"></span><span class="hint gate" id="gate-hint">keys fly the drone</span>` +
  `<span class="caps"><kbd>-</kbd><kbd>=</kbd></span><span class="hint">speed down / up</span>` +
  `<span class="caps"><kbd>\\</kbd><kbd>tab</kbd></span><span class="hint">sport on / off</span>` +
  `<span class="caps"><kbd>${VIDEO_KEY}</kbd></span><span class="hint">minimize / restore video</span>`;

// ---- sending ----

function post(path, body) {
  return fetch(path, { method: "POST", body: body ? JSON.stringify(body) : "", keepalive: true })
    .catch(() => {});
}

function releaseKeys() {
  keys.clear();
  drawInput();
}

function stop() {
  keys.clear();
  for (const pad of pads) pad.release();
  drawInput();
  post("/api/stop");
  $("stop").classList.add("flash");
  setTimeout(() => $("stop").classList.remove("flash"), FLASH_MS);
}

function toggleVideo() {
  const mini = document.body.classList.toggle("mini");
  $("toggle-label").textContent = mini ? "show video" : "minimize video";
  $("video").title = mini ? "click to restore" : "";
}

// Physical key positions, so Shift or a keyboard layout never changes what a key does.
function keyName(event) {
  if (event.code === "Space") return STOP_KEY;
  return event.code.startsWith("Key") ? event.code.slice(3).toLowerCase() : "";
}

window.addEventListener("keydown", (event) => {
  if (typing()) return;
  // macOS drops key-ups while Cmd is held, so any shortcut releases everything.
  if (event.metaKey || event.ctrlKey || event.altKey) { releaseKeys(); return; }
  const key = keyName(event);
  if (key === STOP_KEY) { event.preventDefault(); if (!event.repeat) stop(); return; }
  if (key === VIDEO_KEY) { if (!event.repeat) toggleVideo(); return; }
  if (key === PHOTO_KEY || key === RECORD_KEY) {
    if (!event.repeat && captureAvailable) (key === PHOTO_KEY ? takePhoto : toggleRecord)();
    return;
  }
  if (!(key in BINDINGS)) return;
  event.preventDefault();
  if (event.repeat) return;
  keys.add(key);
  drawInput();
});
window.addEventListener("keyup", (event) => {
  keys.delete(keyName(event));
  drawInput();
});
$("d-wifi-pw").addEventListener("focus", releaseKeys);
// Losing focus releases this page's keys and pads at once (posting neutral), but is not STOP:
// an autopilot action (patrol from ROS, the API) keeps flying while the window is in the back.
function releaseAll() {
  keys.clear();
  for (const pad of pads) pad.release();
  drawInput();
  post(`/api/sticks?tab=${TAB_ID}`, inputAxes());
}
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

$("stop").addEventListener("pointerdown", (event) => { event.preventDefault(); stop(); });
$("toggle-video").addEventListener("click", toggleVideo);
$("video").addEventListener("click", () => { if (document.body.classList.contains("mini")) toggleVideo(); });
// Keep focus off buttons, so Space never "clicks" one.
for (const button of document.querySelectorAll("button")) {
  button.addEventListener("mousedown", (event) => event.preventDefault());
}

// ---- speed cap ----
// Presets in % of full stick; - and = step through them. The server holds the value.
const SPEED_PRESETS = [20, 40, 60, 80, 100];
let speed = 0;

function setSpeed(value) {
  speed = value;
  renderSpeed(value);
  post("/api/max", { max: value });
}

function stepSpeed(direction) {
  const index = SPEED_PRESETS.findIndex((preset) => preset >= speed);
  const current = index === -1 ? SPEED_PRESETS.length - 1 : index;
  const next = Math.min(Math.max(current + direction, 0), SPEED_PRESETS.length - 1);
  setSpeed(SPEED_PRESETS[next]);
}

function renderSpeed(value) {
  speed = value;
  for (const button of $("speed").querySelectorAll("button")) {
    button.classList.toggle("on", Number(button.dataset.value) === value);
  }
}

for (const preset of SPEED_PRESETS) {
  const button = document.createElement("button");
  button.className = "btn";
  button.type = "button";
  button.dataset.value = String(preset);
  button.textContent = String(preset);
  button.addEventListener("mousedown", (event) => event.preventDefault());
  button.addEventListener("click", () => setSpeed(preset));
  $("speed").append(button);
}

// ---- sport: is_sport_mode in every stick packet. The server holds it; off by default. ----
let sport = false;
const sportButton = document.createElement("button");
sportButton.className = "btn";
sportButton.id = "sport";
sportButton.type = "button";
sportButton.title = "is_sport_mode in the stick packets (the app never sets it). Keys \\ or Tab";
sportButton.addEventListener("mousedown", (event) => event.preventDefault());
sportButton.addEventListener("click", () => setSport(!sport));
$("speed").append(sportButton);

function setSport(on) {
  renderSport(on);
  post("/api/sport", { on });
}

function renderSport(on) {
  sport = on;
  sportButton.textContent = on ? "sport on" : "sport off";
  sportButton.classList.toggle("on", on);
  setCell("sport-cell", "sport", on ? "on" : "off", on ? "sport" : "");
}

window.addEventListener("keydown", (event) => {
  if (typing() || event.metaKey || event.ctrlKey || event.altKey) return;
  if (SPORT_KEY_CODES.includes(event.code)) {
    event.preventDefault();
    if (!event.repeat) setSport(!sport);
    return;
  }
  if (event.repeat) return;
  if (event.code === "Minus") stepSpeed(-1);
  if (event.code === "Equal") stepSpeed(1);
});

// Each tab tags its posts, so the server can ignore an idle tab's neutral posts while another flies.
const TAB_ID = Math.random().toString(36).slice(2);
setInterval(() => post(`/api/sticks?tab=${TAB_ID}`, inputAxes()), SEND_MS);
drawInput();

// ---- telemetry ----

const meters = {};
for (const axis of AXES) {
  $("meters").insertAdjacentHTML("beforeend",
    `<span class="mono">${axisLabel(axis)}</span>` +
    `<div class="meter"><b class="cap"></b><b class="cap"></b><i></i></div><output>0</output>`);
  const row = $("meters").lastElementChild;
  meters[axis] = { meter: row.previousElementSibling, value: row };
}

function setText(id, text, warn = false) {
  const element = $(id);
  element.textContent = text;
  element.classList.toggle("warn", warn);
}

function setCell(id, label, value, level = "") {
  $(id).innerHTML = `${label} <b>${value}</b>`;
  $(id).className = `cell mono ${level}`;
}

function renderSticks(sticks) {
  const capPercent = (sticks.max / AXIS_LIMIT) * 50;
  for (const axis of AXES) {
    const value = sticks.output[axis];
    const width = (Math.min(Math.abs(value), AXIS_LIMIT) / AXIS_LIMIT) * 50;
    const { meter, value: output } = meters[axis];
    const [low, high] = meter.querySelectorAll(".cap");
    low.style.left = `${50 - capPercent}%`;
    high.style.left = `${50 + capPercent}%`;
    meter.lastElementChild.style.left = `${value < 0 ? 50 - width : 50}%`;
    meter.lastElementChild.style.width = `${width}%`;
    output.textContent = value ? describe(axis, value, 0) : "0";
  }
  $("max-label").textContent = `±${AXIS_LIMIT} · cap ${sticks.max}`;
  $("mode").textContent = sticks.dry_run ? "dry run" : "live";
  $("mode").className = `cell mono ${sticks.dry_run ? "tag" : ""}`;
  setText("s-max", `${sticks.max} / ${AXIS_LIMIT}`);
  renderSpeed(sticks.max);
  setText("s-sent", sticks.sent.toLocaleString());
  setText("s-non-neutral", sticks.non_neutral_sent.toLocaleString());
  // Red when a key is held but the gate holds the sticks: the drone is not the problem then.
  // Also red with more than one tab open: only the tab that is flying should stay open.
  const extraTabs = sticks.open_tabs > 1;
  const gateText = extraTabs ? `${sticks.gate} · ${sticks.open_tabs} tabs open, close the others` : sticks.gate;
  setText("s-gate", gateText, extraTabs || (keys.size > 0 && sticks.gate !== GATE_LIVE));
  setText("s-errors", String(sticks.errors), sticks.errors > 0);
  setText("s-target", sticks.target);
  setText("s-source", CONTROL_SOURCE_NAMES[sticks.control_source] ?? String(sticks.control_source));
  setText("s-sport", sticks.sport ? "on · field 2 = 1" : "off · like the app", sticks.sport);
  renderSport(sticks.sport);
  renderLastPacket(sticks.last_packet);
  setText("s-last-error", sticks.last_error || "—", Boolean(sticks.last_error));
}

function renderLastPacket(packet) {
  if (!packet) {
    for (const id of ["s-last-axes", "s-last-packet", "s-last-hex"]) setText(id, "—");
    return;
  }
  const moving = AXES.filter((axis) => packet.axes[axis]);
  const axes = moving.map((axis) => describe(axis, packet.axes[axis], 0)).join(" · ") || "neutral";
  setText("s-last-axes", `seq ${packet.seq} · ${axes}${packet.sport ? " · sport" : ""}`);
  setText("s-last-packet", AXES.map((axis) => `${axis} ${signed(packet.packet[axis], 0)}`).join("  "));
  setText("s-last-hex", packet.hex);
}

const video = { last: null, samples: [], frameChangedAt: 0, fps: 0 };

function noVideoReason(stats) {
  if (!stats.decoding) return "decoding is off (--no-decode)";
  if (!stats.packets) return `waiting for packets on UDP ${stats.port}`;
  return `${stats.packets} packets · ${stats.kind || "payload not recognised"} · nothing decoded yet`;
}

function renderVideo(stats) {
  const now = performance.now();
  if (!video.last || stats.frames !== video.last.frames) video.frameChangedAt = now;
  video.last = stats;
  video.samples.push([now, stats.frames]);
  while (now - video.samples[0][0] > FPS_WINDOW_MS) video.samples.shift();
  const [firstTime, firstFrames] = video.samples[0];
  video.fps = now > firstTime ? ((stats.frames - firstFrames) * 1000) / (now - firstTime) : 0;

  const decoding = stats.frames > 0;
  $("no-video").hidden = decoding;
  $("no-video-detail").textContent = noVideoReason(stats);
  $("cam-port").textContent = `cam · udp ${stats.port}`;
  const size = stats.width ? `${stats.width}×${stats.height}` : "";
  $("cam-format").textContent = decoding ? [stats.codec, size, `${stats.fps.toFixed(0)} fps`].filter(Boolean).join(" · ") : "";
  setText("v-size", size || "—");
  setText("v-fps", stats.decoding ? stats.fps.toFixed(1) : "—");
  $("v-port").textContent = `udp ${stats.port}`;
  setText("v-packets", stats.packets.toLocaleString());
  setText("v-pps", stats.pps.toFixed(1));
  setText("v-kbps", (stats.bytes_per_s / 1024).toFixed(0));
  setText("v-frames", `${stats.frames.toLocaleString()} · ${video.fps.toFixed(1)} fps`);
  setText("v-kind", stats.kind || "—");
  setText("v-codec", stats.codec || (stats.decoding ? "detecting" : "off"));
  setText("v-senders", stats.senders.join(", ") || "—");
  setText("v-dump", stats.dump || "off");
  $("hex-cell").hidden = decoding || !stats.previews.length;
  $("hex").textContent = stats.previews.slice(0, HEX_LINES).join("\n");
}

// ---- drone (Bluetooth) ----

const num = (value, digits = 0) => (value === null || value === undefined ? "—" : Number(value).toFixed(digits));
const xyz = (v) => (v ? `${signed(v.x, 2)} ${signed(v.y, 2)} ${signed(v.z, 2)}` : "—");
const altitude = (v) => (v ? `${(-v.z).toFixed(2)} m` : "—");  // the drone frame has z down
// Position is only meaningful in flight: its origin resets at takeoff (issue #13).
const onGround = (d) => !d.flight_state.in_flight;
const gigabytes = (kib) => (kib === null ? "—" : (kib / KIB_PER_GIB).toFixed(1));

// One block per message group: its age (from the server clock) and its rows.
const DRONE_GROUPS = [
  { id: "state", title: "Flight state", ts: (d) => d.flight_state.ts,
    rows: [["state", "wide", (d) => d.flight_state.value ?? "—"]] },
  { id: "battery", title: "Battery", ts: (d) => d.battery.ts, bar: true, rows: [
    ["charge", "", (d) => (d.battery.soc === null ? "—" : `${d.battery.soc} %`)],
    ["charging", "", (d) => (d.battery.charging === null ? "—" : d.battery.charging ? "yes" : "no")],
    ["voltage", "", (d) => num(d.battery.voltage)], ["current", "", (d) => num(d.battery.current)],
    ["temp", "", (d) => num(d.battery.temp)]] },
  { id: "odometry", title: "Odometry", ts: (d) => d.odometry.ts, rows: [
    ["altitude (−z) · zeroed at takeoff", "wide alt",
      (d) => (onGround(d) ? "on ground" : altitude(d.odometry.position))],
    ["position x y z (z down) · frame resets at takeoff", "wide", (d) => xyz(d.odometry.position), onGround],
    ["velocity x y z", "wide", (d) => xyz(d.odometry.velocity)],
    ["motor rpm", "wide", (d) => (d.odometry.motors_rpm || []).join("  ") || "—"],
    ["total current", "", (d) => num(d.odometry.total_current)]] },
  { id: "camera", title: "Camera", ts: (d) => d.camera_tilt.ts ?? (tiltEstimate ? serverNow : null), rows: [
    ["camera tilt ° · 0 = level, −90 = down", "wide", (d) => tiltText(d)]] },
  { id: "storage", title: "Storage", ts: (d) => d.storage.ts, rows: [
    ["free", "", (d) => `${gigabytes(d.storage.available_bytes)} GB`],
    ["total", "", (d) => `${gigabytes(d.storage.total_bytes)} GB`]] },
  { id: "exception", title: "Last exception", ts: (d) => d.exception.ts, rows: [
    ["codes", "wide", (d) => (d.exception.errors ? d.exception.errors.join(", ") || "none" : "—")],
    ["event", "", (d) => num(d.exception.event)]] },
];

// The SDK server (drone.sdk) estimates the camera tilt from the gimbal stick sent (sdk/tilt.py).
let tiltEstimate = null;
let tiltTask = null;  // the SDK's "tilt" action (presets), while it is the latest action
let serverNow = null;
const TILT_RESULT_S = 6;  // how long a stopped/failed tilt stays in the row
const degrees = (value) => `${value < 0 ? "−" : "+"}${Math.abs(value).toFixed(0)}°`;
function tiltText(d) {
  if (d.camera_tilt.degrees !== null) return `${degrees(d.camera_tilt.degrees)} · reported`;
  if (!tiltEstimate) return "not reported (the X1 never sent it)";
  if (tiltTask && tiltTask.state === "running") {
    const target = degrees(tiltTask.detail.target_deg);
    return tiltEstimate.anchored ? `tilting… → ${target} · now ≈ ${degrees(tiltEstimate.deg)}`
      : `tilting… → ${target} · anchoring at the top stop first`;
  }
  const recent = tiltTask && tiltTask.ended_at && serverNow - tiltTask.ended_at < TILT_RESULT_S;
  if (recent && tiltTask.state !== "done") {
    const now = tiltEstimate.anchored ? ` · ≈ ${degrees(tiltEstimate.deg)}` : "";
    return `tilt ${tiltTask.state}${tiltTask.message ? `: ${tiltTask.message}` : ""}${now}`;
  }
  if (!tiltEstimate.anchored) {
    return `unknown — hold U or O to a stop (${degrees(tiltEstimate.low_deg)} … ${degrees(tiltEstimate.high_deg)})`;
  }
  return `≈ ${degrees(tiltEstimate.deg)} · estimated`;
}

for (const group of DRONE_GROUPS) {
  const rows = group.rows.map(([label, cls, , ], i) =>
    `<div class="${cls}"><label class="mono">${label}</label><output id="d-${group.id}-${i}">—</output>` +
    `${group.bar && i === 0 ? '<div class="bar"><i></i></div>' : ""}</div>`).join("");
  $("d-groups").insertAdjacentHTML("beforeend",
    `<div class="group" id="d-${group.id}"><h3 class="mono"><span>${group.title}</span><span></span></h3>` +
    `<div class="kv">${rows}</div></div>`);
}

const age = (now, ts) => (ts === null ? null : Math.max(0, now - ts));
const ageText = (seconds) => (seconds === null ? "no data" : `${seconds.toFixed(1)} s`);
const isStale = (seconds) => seconds === null || seconds > DATA_STALE_S;

function renderGroups(drone, now) {
  for (const group of DRONE_GROUPS) {
    const seconds = age(now, group.ts(drone));
    const element = $(`d-${group.id}`);
    element.classList.toggle("stale", isStale(seconds));
    element.querySelector("h3 span:last-child").textContent = ageText(seconds);
    group.rows.forEach(([, , value, dim], i) => {
      const output = $(`d-${group.id}-${i}`);
      output.textContent = value(drone);
      output.classList.toggle("dim", Boolean(dim && dim(drone)));
    });
  }
  const soc = drone.battery.soc ?? 0;
  $("d-battery").querySelector(".bar i").style.width = `${Math.max(0, Math.min(100, soc))}%`;
}

function linkText(connection, note) {
  if (note) return note;
  if (connection.connected) return "connected";
  return connection.error ? `error · ${connection.error}` : "searching";
}

function renderDrone(state) {
  const drone = state.drone, sticks = state.sticks;
  tiltEstimate = state.estimate ? state.estimate.tilt : null;
  tiltTask = state.estimate && state.estimate.task.name === "tilt" ? state.estimate.task : null;
  serverNow = state.now;
  renderTiltPresets(Boolean(state.drone && state.estimate));
  const present = Boolean(drone);
  for (const element of [$("d-groups"), ...document.querySelectorAll("#drone .actions")]) {
    element.hidden = !present;
  }
  $("d-manual").classList.toggle("off", !present);
  // The Wi-Fi starts by itself on every Bluetooth connect; the form is only a fallback.
  const wifi = present ? drone.wifi : null;
  $("d-wifi").hidden = !wifi || wifi.state === "on" || wifi.state === "pending";
  if (wifi && wifi.password && !$("d-wifi-pw").value) $("d-wifi-pw").value = wifi.password;
  $("d-wifi-note").textContent = [wifiText(present ? drone.wifi : null),
    announceText(present ? drone.app_announced : null)].filter(Boolean).join(" · ");
  autoStartVideo(state);
  renderManualSteps(state, present);
  const connected = present && drone.connection.connected;
  const mode = present && drone.mode.name && !isStale(age(state.now, drone.mode.ts)) ? drone.mode.name : null;
  $("d-mode").textContent = mode ?? "—";
  $("d-mode").classList.toggle("stale", !mode);
  $("d-note").textContent = linkText(present ? drone.connection : { connected: false }, state.ble_note) +
    (present && connected ? ` · last message ${ageText(drone.connection.last_message_age_s)}` : "");
  $("d-link-age").textContent = present ? (connected ? "connected" : "no link") : "off";
  setCell("drone-mode", "mode", mode ?? "—", mode === "MANUAL" ? "tag" : "");
  renderTakeoff(present ? drone : null, state.now);
  renderQuality(present ? drone.video_quality : null);
  if (present) {
    renderGroups(drone, state.now);
    const soc = drone.battery.soc;
    const old = isStale(age(state.now, drone.battery.ts));
    setCell("battery", "bat", soc === null ? "—" : `${soc}%`, old ? "stale" : "");
  } else {
    setCell("battery", "bat", "—");
  }
  renderLock(sticks, present);
}

// Flight state in the top bar, and a banner over the video while the drone takes off by itself.
function renderTakeoff(drone, now) {
  const fresh = drone && drone.flight_state.value && !isStale(age(now, drone.flight_state.ts));
  const value = fresh ? drone.flight_state.value : null;
  const takeoff = TAKEOFF_STATES[value];
  setCell("flight-state", "state", value ?? "—", takeoff ? "tag" : "");
  $("takeoff").hidden = !takeoff;
  if (takeoff) [$("takeoff-title").textContent, $("takeoff-hint").textContent] = takeoff;
}

function renderQuality(quality) {
  for (const button of $("quality").querySelectorAll("button")) {
    button.classList.toggle("on", Boolean(quality) && button.dataset.quality === quality.wanted);
    button.classList.toggle("off", !quality);
  }
  if (!quality) { setText("v-quality", "needs the bluetooth link"); return; }
  const drone = quality.applied ? `set to ${quality.applied}` : "untouched (the app's preview)";
  const error = quality.error ? ` · ${quality.error}` : "";
  setText("v-quality", `${quality.wanted} / ${drone}${error}`, Boolean(quality.error));
}

function renderLock(sticks, present) {
  const locked = sticks.interlock && sticks.locked;
  const reason = present ? "not MANUAL" : "no bluetooth link";
  $("lock").hidden = !locked;
  const sent = sticks.silent ? "nothing is sent" : "neutral is sent";
  $("lock").textContent = `LOCKED · ${reason}`;
  document.querySelector(".controls").classList.toggle("locked", locked);
  $("gate-hint").textContent = !sticks.interlock ? "keys fly the drone (interlock off)"
    : locked ? `keys locked: ${reason}${sticks.dry_run ? " (dry run: still printed)" : `, ${sent}`}` : "keys fly the drone (MANUAL)";
}

function renderManualSteps(state, present) {
  const element = $("d-manual-steps");
  const entry = present ? state.drone.manual_entry : null;

  if (!present) { element.textContent = ""; return; }
  const ssid = state.drone.wifi.ssid ?? "the drone's Wi-Fi";
  const mode = state.drone.mode.name ?? "—";
  const marks = MANUAL_STEPS.map((step) => `${step} ${entry.steps.includes(step) ? "✓" : "·"}`).join(" / ");
  const hint = onDroneWifi ? "" : ` · not on ${ssid} yet: Manual control joins it`;
  const error = entry.error ? ` · ${entry.error}` : "";
  element.textContent = `${marks} / mode: ${mode}${entry.session ? " · session on" : ""}${error}${hint}`;
  element.classList.toggle("warn", Boolean(entry.error) || !onDroneWifi);
}

// connect_type_request(APP) + clock, sent over Bluetooth on every connect like the app does
function announceText(announced) {
  if (!announced) return "";
  if (announced.ok) return "app announced ✓";
  return announced.error ? `app announce: ${announced.error}` : "";
}

function wifiText(wifi) {
  if (!wifi || wifi.state === "off") return "";
  if (wifi.state === "on") return `wifi: on · ${wifi.ssid}`;
  if (wifi.state === "error") return `wifi: ${wifi.error}`;
  return "wifi: starting...";
}

let statusTimer = 0;

async function droneAction(name, path, body) {
  showStatus(`${name} · sending...`);
  try {
    const response = await fetch(path, { method: "POST", body: body ? JSON.stringify(body) : "" });
    const result = await response.json();
    showStatus(result.ok ? `${name} · ok` : `${name} · ${result.error || "failed"}`, !result.ok);
  } catch (error) {
    showStatus(`${name} · ${error.message}`, true);
  }
}

// ---- estimated pose: compass + path map (drone.sdk server only, from its Estimator) ----
// Frame: the odometry's takeoff frame. Heading 0 = its +x, drawn up; + = clockwise (turn right).
// So a frame point (x, y) is drawn at (y, -x).

const SVG_NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, text) => {
  const element = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
  if (text !== undefined) element.textContent = text;
  return element;
};
const onDial = (deg, r) => [r * Math.sin(deg * Math.PI / 180), -r * Math.cos(deg * Math.PI / 180)];

for (let deg = 0; deg < 360; deg += COMPASS_TICK_DEG) {
  const major = deg % 90 === 0;
  const [x1, y1] = onDial(deg, major ? 76 : 81), [x2, y2] = onDial(deg, 88);
  $("ticks").append(svgEl("line", { class: "ln", x1, y1, x2, y2 }));
  if (major) {
    const [x, y] = onDial(deg, 64);
    $("ticks").append(svgEl("text", { class: "svg-text", x, y: y + 4, "font-size": 11,
      "text-anchor": "middle" }, deg === 0 ? "+x" : String(deg)));
  }
}

let needleAngle = 0;  // unwrapped, so the needle turns the short way through 0
function unwrap(previous, deg) {
  return previous + ((((deg - previous) % 360) + 540) % 360) - 180;
}

function wedgePath(heading, sigma) {
  if (sigma >= 180) return "M -88 0 A 88 88 0 1 1 88 0 A 88 88 0 1 1 -88 0 Z";
  const [x1, y1] = onDial(heading - sigma, 88), [x2, y2] = onDial(heading + sigma, 88);
  return `M 0 0 L ${x1} ${y1} A 88 88 0 ${sigma > 90 ? 1 : 0} 1 ${x2} ${y2} Z`;
}

function renderEstimate(estimate) {
  $("estimate").hidden = !estimate;
  if (!estimate) return;
  const pose = estimate.pose;
  const [vx, vy] = pose.velocity;
  const speed = Math.hypot(vx, vy);
  const travel = Math.atan2(vy, vx) * 180 / Math.PI;
  needleAngle = unwrap(needleAngle, pose.heading_deg);
  $("needle").style.transform = `rotate(${needleAngle}deg)`;
  $("wedge").setAttribute("d", wedgePath(pose.heading_deg, pose.heading_sigma_deg));
  const moving = pose.in_flight && speed >= TRAVEL_MIN_SPEED;
  $("travel").style.display = moving ? "" : "none";
  const length = Math.min(TRAVEL_MAX_LEN, TRAVEL_MIN_LEN + speed * TRAVEL_LEN_PER_MPS);
  $("travel").setAttribute("transform", `rotate(${travel})`);
  $("travel-line").setAttribute("y2", -length);
  $("travel-head").setAttribute("points", `0,${-length - 6} -5,${-length + 4} 5,${-length + 4}`);
  setText("e-heading", `${degrees(pose.heading_deg)} · ±${pose.heading_sigma_deg.toFixed(0)}°`,
    pose.heading_sigma_deg > 45);
  setText("e-travel", moving ? `${degrees(travel)} · ${speed.toFixed(2)} m/s` : "hovering");
  setText("e-position", pose.in_flight
    ? `${signed(pose.x, 2)} ${signed(pose.y, 2)} · ±${pose.position_sigma_m.toFixed(1)} m` : "on ground");
  setText("e-alt", pose.in_flight ? `${pose.alt.toFixed(2)} m` : "—");
  const task = estimate.task;
  const progress = task.patrol && task.state === "running"
    ? ` · loop ${task.patrol.loop} wp ${task.patrol.index ?? "—"} ${task.patrol.state}` : "";
  setText("e-task", task.name ? `${task.name} · ${task.state}${progress}${task.message ? ` · ${task.message}` : ""}`
    : "idle", task.state === "failed" || task.state === "landed");
  $("e-source").textContent = estimate.estimator;
  $("e-note").textContent = `${estimate.estimator}: heading = yaw stick × ${estimate.yaw_rate_dps?.toFixed(0) ?? "?"}°/s` +
    " + direction of travel; position = 1 Hz odometry, extrapolated. Not a real compass: 0° is the takeoff frame's +x.";
  renderMap(estimate);
}

function renderMap(estimate) {
  const pose = estimate.pose;
  const here = pose.in_flight ? [pose.x, pose.y] : [0, 0];
  const points = [[0, 0], here, ...estimate.path, ...estimate.waypoints];
  if (estimate.target) points.push(estimate.target.slice(0, 2));
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const half = Math.max(MAP_MIN_HALF_M,
    (Math.max(...xs) - Math.min(...xs)) / 2 + MAP_MARGIN_M, (Math.max(...ys) - Math.min(...ys)) / 2 + MAP_MARGIN_M);
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const map = $("map");
  map.setAttribute("viewBox", `${cy - half} ${-cx - half} ${2 * half} ${2 * half}`);
  map.replaceChildren();
  const grid = half > 8 ? 2 : 1;
  $("e-scale").textContent = `grid ${grid} m`;
  for (let v = Math.ceil((cy - half) / grid) * grid; v <= cy + half; v += grid) {
    map.append(svgEl("line", { class: "ln rule", x1: v, y1: -cx - half, x2: v, y2: -cx + half }));
  }
  for (let v = Math.ceil((cx - half) / grid) * grid; v <= cx + half; v += grid) {
    map.append(svgEl("line", { class: "ln rule", x1: cy - half, y1: -v, x2: cy + half, y2: -v }));
  }
  const [xMin, xMax, yMin, yMax] = estimate.fence;
  map.append(svgEl("rect", { class: "ln faint dash", x: yMin, y: -xMax, width: yMax - yMin, height: xMax - xMin }));
  const mark = half * 0.05, font = half * 0.09;
  map.append(svgEl("path", { class: "ln faint", d: `M ${-mark} 0 H ${mark} M 0 ${-mark} V ${mark}` }));
  map.append(svgEl("text", { class: "svg-text", x: mark * 1.4, y: font * 1.2, "font-size": font }, "takeoff"));
  if (estimate.path.length > 1) {
    map.append(svgEl("polyline", { class: "ln", points: estimate.path.map(([x, y]) => `${y},${-x}`).join(" ") }));
  }
  estimate.waypoints.forEach(([x, y], i) => {
    map.append(svgEl("rect", { class: "ln", x: y - mark, y: -x - mark, width: 2 * mark, height: 2 * mark }));
    map.append(svgEl("text", { class: "svg-text", x: y + mark * 1.5, y: -x - mark * 1.5, "font-size": font }, String(i)));
  });
  if (estimate.target) {
    const [x, y] = estimate.target;
    map.append(svgEl("circle", { class: "ln dash", cx: y, cy: -x, r: mark * 2 }));
  }
  if (!pose.in_flight) return;
  map.append(svgEl("circle", { class: "ln faint", cx: pose.y, cy: -pose.x, r: Math.max(pose.position_sigma_m, mark) }));
  const drone = svgEl("polygon", { class: "ink", points: `0,${-mark * 2.2} ${mark},${mark} ${-mark},${mark}`,
    transform: `translate(${pose.y} ${-pose.x}) rotate(${pose.heading_deg})` });
  map.append(drone);
}

let captureAvailable = false;

function showCapture(text, warn = false) {
  const element = $("c-status");

  element.textContent = text;
  element.classList.toggle("warn", warn);
  clearTimeout(captureTimer);
  captureTimer = setTimeout(() => { element.hidden = true; }, STATUS_MS);

async function capture(label, path, body) {
  try {
    const response = await fetch(path, { method: "POST", body: JSON.stringify(body ?? {}) });
    const result = await response.json();
    const ok = response.ok && result.ok !== false;
    showCapture(`${label} · ${ok ? result.path ?? "ok" : result.error ?? "failed"}`, !ok);
    return ok ? result : null;
  } catch (error) {
    showCapture(`${label} · ${error.message}`, true);
    return null;
  }
}

let stateAt = 0;
let serverLost = false;
let seenFrames = 0;

// A finished MJPEG response leaves the <img> frozen on its last frame without firing
// onerror, so reopen the stream when the server comes back or the decoder restarts.
function reopenStreamIfNeeded(frames) {
  const restarted = serverLost || frames < seenFrames || (seenFrames === 0 && frames > 0);
  seenFrames = frames;
  serverLost = false;
  if (restarted) stream.src = `/video.mjpg?${Date.now()}`;
}

async function poll() {
  try {
    const response = await fetch("/api/state", { cache: "no-store", signal: AbortSignal.timeout(STALE_MS) });
    const state = await response.json();
    stateAt = performance.now();
    reopenStreamIfNeeded(state.video.frames || 0);
    renderSticks(state.sticks);
    renderVideo(state.video);
    renderDrone(state);
    renderEstimate(state.estimate);
    renderCapture(state);
  } catch {
    serverLost = true; // the freshness clock shows the link as lost
  }
  setTimeout(poll, POLL_MS);
}

function renderClock() {
  const now = performance.now();
  if (stateAt) {
    const age = (now - stateAt) / 1000;
    const lost = now - stateAt > STALE_MS;
    setCell("link", lost ? "link lost" : "link", `${age.toFixed(1)} s`, lost ? "warn" : "");
  }
  const stats = video.last;
  if (!stats) return;
  const stalledFor = now - video.frameChangedAt;
  const stalled = stats.frames > 0 && stalledFor > VIDEO_STALL_MS;
  $("stall").hidden = !stalled;
  $("stall").textContent = `video stalled · ${(stalledFor / 1000).toFixed(1)} s`;
  if (!stats.frames) setCell("video-status", "video", "none");
  else if (stalled) setCell("video-status", "video", "stalled", "warn");
  else setCell("video-status", "video", `${video.fps.toFixed(0)} fps`);
}

const stream = $("stream");
stream.onerror = () => setTimeout(() => { stream.src = `/video.mjpg?${Date.now()}`; }, RETRY_VIDEO_MS);
stream.src = "/video.mjpg";
